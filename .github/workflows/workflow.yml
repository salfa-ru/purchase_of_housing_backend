name: Dev purchase_of_housing workflow

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v4 
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/purchase_of_housing_backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    # if: github.ref == 'refs/heads/master'   запуск deploy только в том случае, если workflow запускается от ветки master.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Copy nginx.conf via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSPHRASE }}
          source: "nginx.conf"
          target: "purchase_of_housing_backend"
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          # key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSPHRASE }}
          source: "docker-compose.yml"
          target: "purchase_of_housing_backend"
      - name: executing remote ssh commands to deploy using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          # key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSPHRASE }}
          script: |
            
            #  if ! docker volume inspect pgdata_alfa >/dev/null 2>&1; then
            #    docker volume create pgdata_alfa
            # fi
    
            cd purchase_of_housing_backend
            
            rm -f .env
            touch .env
            echo POSTGRES_DB=${{ secrets.POSTGRES_DB }} >> .env
            echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} >> .env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env
            echo DB_HOST=${{ secrets.DB_HOST }} >> .env
            echo DB_PORT=${{ secrets.DB_PORT }} >> .env
            echo SECRET_KEY="${{ secrets.SECRET_KEY }}" >> .env
            echo HOST_IP="${{ secrets.HOST_IP }}" >> .env
            echo DOMAIN="${{ secrets.DOMAIN }}" >> .env
            
            echo DEBUG=${{ secrets.DEBUG }} >> .env
            # echo DEBUG=False >> .env
            
            № echo DEBUG=True >> .env
            # echo USE_SQLITE=True >> .env
            
            # Добавьте эти команды перед docker compose pull
            echo "=== Checking postgres data directory ==="
            sudo ls -la /opt/postgres_data
            echo "=== Directory contents before deployment ==="
             
            # Подтягиваем новые образы       
            sudo docker compose pull # Сначала pull
            
            # Останавливаем текущие контейнеры, сохраняя volumes
            sudo docker compose down --volumes=false

            # Запускаем сервисы
            sudo docker compose up -d
            
            # После docker compose up -d добавьте:
            echo "=== Checking postgres data directory after deployment ==="
            sudo ls -la /opt/postgres_data
            echo "=== Directory contents after deployment ==="
            
            echo "=== Checking PostgreSQL logs ==="
            sudo docker compose logs db
            
            echo "=== Checking Environment Variables ==="
            sudo docker compose exec -T backend env | grep -E "POSTGRES|DB_"
            
            echo "=== Checking Database Connection ==="
            sudo docker compose exec -T backend python manage.py shell -c "
            from django.db import connections
            from django.db.utils import OperationalError
            try:
                connections['default'].cursor()
                print('Database connection successful')
            except OperationalError as e:
                print(f'Database connection failed: {e}')"
            
            echo "=== PostgreSQL Configuration ==="
            sudo docker compose exec -T db psql -U $POSTGRES_USER -d $POSTGRES_DB -c "\l+"
    
            echo "=== Database state ==="
            sudo docker compose exec -T backend python manage.py shell -c "
            import os
            print(f'Database settings:')
            print(f'ENGINE: {os.environ.get('DB_ENGINE', 'Not set')}')
            print(f'NAME: {os.environ.get('POSTGRES_DB', 'Not set')}')
            print(f'HOST: {os.environ.get('DB_HOST', 'Not set')}')
            print(f'PORT: {os.environ.get('DB_PORT', 'Not set')}')
            from django.db import connection
            print(f'Using backend: {connection.vendor}')
            try:
                from users.models import User
                print(f'User count: {User.objects.count()}')
            except Exception as e:
                print(f'Error: {str(e)}')"
            
            
            # Ждем, пока база данных будет готова
            echo "Waiting for database to be ready..."
            sleep 10
            
            # Выполняем миграции
            sudo docker compose exec -T backend python manage.py makemigrations
            sudo docker compose exec -T backend python manage.py migrate
            sudo docker compose exec -T backend python manage.py collectstatic --no-input
            
            # Проверяем наличие данных в базе и загружаем их, если база пуста
            echo "========  Checking if database is empty...           ========="
            RECORD_COUNT=$(sudo docker compose exec -T backend python manage.py shell -c "from users.models import User; print(User.objects.count())")
            
            # показывает 4 пользователя из командной строки после запуска приложения!
            
            if [ "$RECORD_COUNT" = "0" ]
            then
              echo "========  Database is empty, loading initial data... ========"
              sudo docker compose exec -T backend python manage.py loaddata data.json
            else
              echo "++++++++  SOMETHING IN THE DATABASE!!!!              ++++++++"
            fi
            
            # В любом случае обновляем разрешения модераторов!!!
            echo "Updating moderator permissions..."
            sudo docker compose exec -T backend python manage.py fix_moderator_permissions
                        
            # Запускаем qcluster!???
            sudo docker compose exec -T backend bash -c "
              nohup python manage.py qcluster > /dev/null 2>&1 &"
          

