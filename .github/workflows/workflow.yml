name: Dev purchase_of_housing workflow

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  build_and_push_to_docker_hub:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to Docker Hub
        uses: docker/build-push-action@v4 
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/purchase_of_housing_backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push_to_docker_hub
    # if: github.ref == 'refs/heads/master'   запуск deploy только в том случае, если workflow запускается от ветки master.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      # - name: Copy Dockerfile via ssh
      #   uses: appleboy/scp-action@master
      #   with:
      #     host: ${{ secrets.HOST }}
      #     username: ${{ secrets.USER }}
      #     password: ${{ secrets.PASSPHRASE }}
      #     source: "Dockerfile"
      #     target: "purchase_of_housing_backend"
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          # key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.PASSPHRASE }}
          source: "docker-compose.yml"
          target: "purchase_of_housing_backend"
      - name: executing remote ssh commands to deploy using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          # key: ${{ secrets.SSH_KEY }}
          # sudo docker pull ${{ secrets.DOCKER_USERNAME }}/purchase_of_housing_backend:latest
          password: ${{ secrets.PASSPHRASE }}
          script: |
            cd purchase_of_housing_backend
            sudo docker compose -f docker-compose.yml down
            sudo docker image prune -af
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/purchase_of_housing_backend:latest
            rm -f .env
            touch .env
            echo POSTGRES_DB=${{ secrets.POSTGRES_DB }} >> .env
            echo POSTGRES_USER=${{ secrets.POSTGRES_USER }} >> .env
            echo POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} >> .env
            echo DB_HOST=${{ secrets.DB_HOST }} >> .env
            echo DB_PORT=${{ secrets.DB_PORT }} >> .env
            echo SECRET_KEY="${{ secrets.SECRET_KEY }}" >> .env
            echo HOST_IP="${{ secrets.HOST_IP }}" >> .env
            echo DOMAIN="${{ secrets.DOMAIN }}" >> .env
            echo DEBUG=${{ secrets.DEBUG }} >> .env
            sudo docker-compose up -d --build
            sudo docker compose exec -T backend bash -c "
            python manage.py makemigrations &&
            python manage.py migrate &&
            python manage.py collectstatic --no-input"
            sudo docker compose exec -T backend bash -c "
            python manage.py fix_moderator_permissions &&
            nohup python manage.py qcluster > /dev/null 2>&1 &"
