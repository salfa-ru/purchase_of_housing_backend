# Будильник тестового стенда.
#
# Render на бесплатном тарифе усыпляет сервис после 15 минут без трафика,
# а после пробуждения первый запрос идёт около минуты. Supabase на бесплатном
# тарифе ставит проект на паузу после недели без обращений к базе, и тогда
# стенд не поднимается вообще: миграции при старте не достучатся до базы.
#
# Поэтому здесь две задачи: часто дёргаем health-эндпоинт, чтобы сервис не
# засыпал, и раз в сутки — ручку, которая реально читает базу. Health отвечает
# 200, не трогая базу, одного его мало.
#
# Окно 03:00-20:00 UTC — это 06:00-23:00 по Москве. Круглосуточный пинг съел бы
# 744 часа из 750 бесплатных на месяц, и в последних числах Render отключил бы
# сервисы разом. По той же причине будим только один стенд: на два часов
# не хватит.
name: Пробуждение стенда и базы

on:
  schedule:
    # Каждые 10 минут — стенд на Render, раз в сутки — база в Supabase
    - cron: '*/10 3-20 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Пинг health-эндпоинта
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 3-20 * * *'

    steps:
      - name: Ping
        env:
          # Переменная репозитория: Settings - Secrets and variables - Actions - Variables.
          # Полный адрес вместе с /hidden-health/
          URL: ${{ vars.TEST_HEALTHCHECK_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Не задана переменная TEST_HEALTHCHECK_URL — стенд никто не будит."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 3 --retry-delay 30 "$URL")
          echo "Ответ: $code"
          test "$code" = "200"

  db-ping:
    name: Пинг базы
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * *'

    steps:
      - name: Ping
        env:
          # Переменная репозитория: Settings - Secrets and variables - Actions - Variables.
          # Лёгкая ручка, читающая базу и не накручивающая счётчики просмотров:
          # https://<адрес стенда>/api/realty/count/
          URL: ${{ vars.TEST_DB_PING_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Не задана переменная TEST_DB_PING_URL — базу никто не будит."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 --retry 5 --retry-delay 30 "$URL")
          echo "Ответ: $code"
          test "$code" = "200"
