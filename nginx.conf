events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Лимиты
    client_max_body_size 100M;

    # Upstream для prod бэкенда
    upstream prod_backend {
        server backend_prod:8080 fail_timeout=0;
        # server unix:/var/kassa/prod.sock fail_timeout=0;
    }

    # Upstream для test бэкенда
    upstream test_backend {
        server backend_test:8080 fail_timeout=0;
        # server unix:/var/kassa/test.sock fail_timeout=0;
    }


    # HTTP сервер для локальной разработки/IP доступа
    server {
        listen 80;
        server_name _; # Listen on any hostname, or specify your server's IP address
        
        location / {
            proxy_pass http://prod_backend; # Or test_backend, depending on which you want to test
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Статические файлы
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы для PROD
        location /media/ {
            alias /var/www/media/prod/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # HTTP редирект на HTTPS для prod
    server {
        listen 80;
        server_name api.prod.philippio.ru;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTP редирект на HTTPS для test
    server {
        listen 80;
        server_name api.test.philippio.ru;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS сервер для PROD
    server {
        listen 443 ssl http2;
        server_name api.prod.philippio.ru;

        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/api.prod.philippio.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.prod.philippio.ru/privkey.pem;
        
        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Статические файлы
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы для PROD
        location /media/ {
            alias /var/www/media/prod/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Проксирование на prod бэкенд
        location / {
            proxy_pass http://prod_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS сервер для TEST
    server {
        listen 443 ssl http2;
        server_name api.test.philippio.ru;

        # SSL сертификаты
        ssl_certificate /etc/letsencrypt/live/api.test.philippio.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.test.philippio.ru/privkey.pem;
        
        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Статические файлы
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы для TEST
        location /media/ {
            alias /var/www/media/test/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Проксирование на test бэкенд
        location / {
            proxy_pass http://test_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
