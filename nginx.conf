events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Оптимизация
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Лимиты
    client_max_body_size 100M;

    # Upstream для prod бэкенда
    upstream prod_backend {
        server backend_prod:8080 fail_timeout=0;
    }

    # Upstream для test бэкенда
    upstream test_backend {
        server backend_test:8080 fail_timeout=0;
    }

    # Карта для динамического выбора upstream и пути к медиа файлам (ИСПОЛЬЗУЕТСЯ ТОЛЬКО В default_server)
    map $host $backend_upstream {
        "api.prod.philippio.ru"    prod_backend;
        "api.test.philippio.ru"    test_backend;
        default                    prod_backend;
    }

    map $host $media_path {
        "api.prod.philippio.ru"    "prod";
        "api.test.philippio.ru"    "test";
        default                    "prod";
    }

    # HTTP редирект на HTTPS для prod и test
    server {
        listen 80;
        server_name api.prod.philippio.ru api.test.philippio.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTP сервер для локальной разработки/IP доступа (должен быть последним)
    server {
        listen 80 default_server;
        server_name _;

        location / {
            # Здесь используем карту, если нужно динамически переключать бэкенды
            # Если это только dev/local, можно использовать статичный 'prod_backend'
            proxy_pass http://prod_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Статические файлы
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы для PROD
        location /media/ {
            alias /var/www/media/prod/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Медиа файлы для TEST
        location /media-test/ {
            alias /var/www/media/test/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }


    # =========================================================
    # ИСПРАВЛЕННЫЕ HTTPS БЛОКИ: Разделены для стабильной работы SSL
    # =========================================================

    # 1. HTTPS сервер для PROD
    server {
        listen 443 ssl http2;
        server_name api.prod.philippio.ru;

        # СТАТИЧЕСКИЕ пути к сертификатам для PROD
        ssl_certificate /etc/letsencrypt/live/api.prod.philippio.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.prod.philippio.ru/privkey.pem;

        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- CORS HEADERS ---
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Статические файлы
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы для PROD (статический путь)
        location /media/ {
            alias /var/www/media/prod/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Проксирование на PROD бэкенд
        location / {
            # Обработка preflight-запросов (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://prod_backend; # Статический upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # 2. HTTPS сервер для TEST
    server {
        listen 443 ssl http2;
        server_name api.test.philippio.ru;

        # СТАТИЧЕСКИЕ пути к сертификатам для TEST
        ssl_certificate /etc/letsencrypt/live/api.test.philippio.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.test.philippio.ru/privkey.pem;

        # SSL настройки
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- CORS HEADERS ---
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

        # Статические файлы
        location /static/ {
            alias /app/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Медиа файлы для TEST (статический путь)
        location /media/ {
            alias /var/www/media/test/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Проксирование на TEST бэкенд
        location / {
            # Обработка preflight-запросов (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://test_backend; # Статический upstream
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}