services:

  postgres_prod:
    image: postgres:17
    env_file: ../.env.prod
    container_name: realty_postgres_prod
    environment:
      # Data that is in env file - removed from here completely
      # POSTGRES_DB: realty_db          # db name
      # POSTGRES_USER: realty_user      # username
      # POSTGRES_PASSWORD: strong_pass  # password
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru-RU"
    volumes:
      - ../pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'" ]  # PostgreSQL is_ready check
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - real_network

  backend_prod:
    build: .
    container_name: realty_django_prod
    env_file: ../.env.prod
    volumes:
      - .:/app
      - ../static:/app/static/
      - ../media_prod:/app/media/
    ports:
      - 8080:8080    # HOST:CONTAINER
    restart: always  # Auto-restart on failure
    depends_on:
      postgres_prod:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/hidden-health/" ]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - real_network

  backend_test:
    build: .
    container_name: realty_django_test
    env_file: ../.env.test
    volumes:
      - .:/app
      - ../static:/app/static/
      - ../media_test:/app/media/
    ports:
      - 8081:8080  # HOST:CONTAINER

    restart: always
    #  Assuming a health check endpoint exists
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/hidden-health/"]
      interval: 60s
      timeout: 10s
      retries: 5
    networks:
      - real_network

  nginx:
    image: nginx:latest
    ports:
      - 80:80    # HTTP
      - 443:443  # HTTPS
    volumes:
      - ../static:/app/static/  # Том для статики
      - ../media_prod:/var/www/media/prod/   # media_prod in Nginx
      - ../media_test:/var/www/media/test/   # media_prod in Nginx
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt    # certificates
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - backend_prod
      - backend_test
    restart: always  # auto-restart
    networks:
      - real_network

networks:
  real_network:
    driver: bridge

