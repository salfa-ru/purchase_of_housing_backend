services:

  postgres_prod:
    image: postgres:17
    env_file: ../.env.prod
    container_name: realty_postgres_prod
    environment:
      POSTGRES_DB: realty_db          # название базы
      POSTGRES_USER: realty_user      # имя пользователя
      POSTGRES_PASSWORD: strong_pass  # пароль
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ru-RU"
    volumes:
      - ../pgdata_prod:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'" ]  # Проверка готовности PostgreSQL к работе.
      interval: 5s  # Интервал между проверками (5 секунд).
      timeout: 5s  # Время ожидания ответа от команды проверки.
      retries: 5  # Количество попыток перед переключением статуса на "неисправен".

    networks:
      - real_network

  backend_prod:
    build: .
    container_name: realty_django_prod
    env_file: ../.env.prod
    volumes:
      - .:/app
#      - static_data:/app/static/
      - ../media_prod:/app/media/
    ports:
      - 8080:8080  # Левое число — порт на хосте, Правое число — порт внутри контейнера
    restart: always  # Автоматический перезапуск контейнера при сбоях.
    depends_on:
      postgres_prod:
        condition: service_healthy
    networks:
      - real_network

  backend_test:
    build: .
    container_name: realty_django_test
    env_file: ../.env.test
    volumes:
      - .:/app
#      - static_data:/app/static/
      - ../media_test:/app/media/
    ports:
      - 8081:8080  # Левое число — порт на хосте, Правое число — порт внутри контейнера

    restart: always  # Автоматический перезапуск контейнера при сбоях.

    networks:
      - real_network

  nginx:
    image: nginx:latest
    ports:
      - 80:80   # HTTP
      - 443:443 # HTTPS
    volumes:
      - static_data:/app/static/  # Том для статики
      - ../media_prod:/var/www/media/prod/ # Путь для продакшен медиа внутри Nginx
      - ../media_test:/var/www/media/test/ # Путь для тестовых медиа внутри Nginx

      - ./nginx.conf:/etc/nginx/nginx.conf
#      - /var/kassa:/var/kassa
      - /etc/letsencrypt:/etc/letsencrypt  # Сертификаты
      - /var/lib/letsencrypt:/var/lib/letsencrypt
    depends_on:
      - backend_prod
      - backend_test  # Ожидание запуска backend перед запуском Nginx
    restart: always  # Перезапуск при сбоях
    networks:
      - real_network

networks:
  real_network:
    driver: bridge

volumes:
  static_data:  # кажется, использую внутреннюю папку static из джанго!
