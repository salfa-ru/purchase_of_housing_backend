target-version = "py311"
line-length = 88
exclude = ["migrations", "venv", ".venv", "env", "__pycache__"]

[lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["config", "users", "realty", "favorites"]

[format]
quote-style = "single"
indent-style = "space"
